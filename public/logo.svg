<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Triángulo Masónico Rojo -->
  <polygon
    points="50,8 92,88 8,88"
    stroke="#e8213c"
    stroke-width="2.5"
    fill="rgba(232, 33, 60, 0.08)"
  />
  <!-- Círculo de Radar Verde -->
  <circle cx="50" cy="58" r="16" stroke="#00e566" stroke-width="1.5" fill="none" />
  <!-- Ojo Central / Pupila Roja -->
  <ellipse cx="50" cy="58" rx="4.5" ry="11" fill="#e8213c" />
  <circle cx="50" cy="58" r="2.5" fill="#ffffff" />
  <!-- Vértices de Tensión / Hilos Ámbar -->
  <line x1="50" y1="8" x2="50" y2="2" stroke="#f0a500" stroke-width="1.5" />
  <line x1="92" y1="88" x2="98" y2="92" stroke="#f0a500" stroke-width="1.5" />
  <line x1="8" y1="88" x2="2" y2="92" stroke="#f0a500" stroke-width="1.5" />
</svg>
